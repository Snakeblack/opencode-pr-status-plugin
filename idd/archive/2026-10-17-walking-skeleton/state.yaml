  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "Every platform read is the execFile('gh', ['pr','list',...]) call in src/client/gh.ts; src/ contains no HTTP client, no api.github.com reference and no token or credential read; the only runtime dependency is @opencode/plugin."
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "src/ performs no filesystem writes and never touches host storage (no node:fs write call, no context.storage use); fetched data lives in the panel's createSignal for the session only; the mocked-host plugin tests pass with a host fake that offers no storage surface at all."
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "Platform text crosses exactly one boundary: toPrViews runs every title and branch through normalizePlatformText (src/domain/safe-text.ts); tests cover ANSI escape sequences, control characters, bidi and zero-width controls and surrogate-pair truncation; the panel renders only those normalised values."
    },
    {
      "kind": "scenario",
      "id": "fresh-ci-state",
      "impact": "conforms",
      "reason": "createRefresher performs the first read immediately on mount and every 30 seconds while the panel is mounted; a tick is skipped while a read is in flight and stop cancels the timer; the data is always a live read from gh, never a local cache."
    },
    {
      "kind": "scenario",
      "id": "panel-resilience",
      "impact": "conforms",
      "reason": "gh failures classify into missing, unauthenticated, offline, rate-limited and error; the panel shows explicit copy per kind, keeps the last good list visible when a refresh fails and the refresher reports sync and async errors without breaking its loop."
    },
    {
      "kind": "scenario",
      "id": "visual-ci-state-legible",
      "impact": "conforms",
      "reason": "Each row shows a distinct state mark (filled circle, cross, half circle, hollow circle) in theme feedback colours (success, error, warning, faint) with muted number and faint branch and draft text; the state stays readable without colour."
    }
  ],
  "attestations": [
    {
      "kind": "adr",
      "id": "0001",
      "evidence": "Source scan: no HTTP client to the platform anywhere in src/ (search for fetch/http/axios/undici/XMLHttpRequest returns no matches); the only platform read is execFile('gh', ['pr','list',...]) in src/client/gh.ts, the single production binding. No credential or token read: process.env is spread only to set LC_ALL/LANG=C for the child. Dependency check: npm ls --omit=dev lists @opencode/plugin only. Host smoke (opencode v2.0.32): the sidebar listed live open PRs through the real gh CLI with no auth handling in the plugin (capture in /tmp/opencode/prstatus-smoke/sidebar-capture-1.txt).",
      "recorded_at": "2026-10-17T17:40:58.798Z"
    },
    {
      "kind": "adr",
      "id": "0002",
      "evidence": "Source scan: no node:fs, writeFile or storage use in src/; the plugin writes no files and touches no host storage. Fetched PRs live only in the panel createSignal while mounted; onCleanup stops the refresher and slot registration returns its unregister function (test/plugin.test.ts asserts both). The mocked host in test/plugin.test.ts exposes no storage surface at all, so any storage call would fail the suite; all tests pass. Host smoke: host logs show only gh/git child processes and no plugin-created files.",
      "recorded_at": "2026-10-17T17:40:58.854Z"
    },
    {
      "kind": "adr",
      "id": "0003",
      "evidence": "Single boundary: toPrViews (src/domain/aggregate.ts) runs every title and branch through normalizePlatformText (src/domain/safe-text.ts) before anything renders. test/aggregate.test.ts feeds an adversarial title (newline + ANSI SGR escape + RLO bidi char) through the full mapping and asserts the cleaned text; test/safe-text.test.ts adds 10 cases: ANSI escapes, C0/C1 controls, zero-width and bidi controls, ordinary text, emoji sequences intact, non-strings, exact limit, truncation that never splits a surrogate pair. rollup-edge-cases.json carries wide/zero-width Unicode titles. Host smoke: wide Unicode and emoji titles rendered intact in the sidebar with no terminal corruption. (Note: the boundary cleans instead of escaping; nothing raw ever reaches the renderer.)",
      "recorded_at": "2026-10-17T17:40:58.911Z"
    }
  ],
