  "status": "closed",
  "intent": {
    "request": "Continue with the roadmap: implement the M1 walking skeleton in docs/roadmap.md. The plugin loads in the host TUI and registers the sidebar panel. It reads the project's open PRs and each PR's aggregated check state through the local client. It refreshes while the panel is open (no manual reload). It renders a plain list with the host's theme tokens and shows clear messages when the client is missing, unauthenticated, offline or rate-limited. No tabs or stack grouping in this slice.",
    "kind": "feature",
    "summary": "M1 walking skeleton: TUI plugin registering a sidebar panel showing the project's open PRs and each PR's aggregated CI state, read through the local gh client, refreshing while the panel is open.",
    "acceptance": "Loaded from this repository into the host TUI, the panel lists the current project's open PRs (number, title, branch) with each one's aggregated CI state (running/green/red) from gh, updates without manual reload, and shows a clear message when the client is missing, unauthenticated, offline or rate-limited, without breaking the TUI."
  },
