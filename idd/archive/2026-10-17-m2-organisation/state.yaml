  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "No new platform path: the change keeps the single local gh invocation and adds no HTTP client or credential read; the call now filters to the user's own pull requests (--author @me)."
    },
    {
      "kind": "adr",
      "id": "0002",
      "impact": "conforms",
      "reason": "Stack grouping is computed in memory on every refresh; the change writes nothing and stores no state host-side."
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "Titles and branches still normalise once inside toPrViews before rendering; the stack matcher compares raw branch names internally and never renders them."
    },
    {
      "kind": "scenario",
      "id": "fresh-ci-state",
      "impact": "conforms",
      "reason": "The refresh loop is untouched: the panel still reflects CI state changes without manual reload."
    },
    {
      "kind": "scenario",
      "id": "panel-resilience",
      "impact": "conforms",
      "reason": "Failure handling is unchanged (per-kind copy, warning colour for transient kinds, last good list kept); the author filter narrows the read without adding failure paths."
    },
    {
      "kind": "scenario",
      "id": "visual-ci-state-legible",
      "impact": "conforms",
      "reason": "The panel groups chains under their root with a per-level indent and a non-colour connector, keeps the per-row state mark and clips long titles to one line, so the list stays readable at a glance in the host theme."
    }
  ],
  "attestations": [
    {
      "kind": "adr",
      "id": "0001",
      "evidence": "Scanned src/ and test/: no HTTP client (fetch/undici/axios/octokit/node:https), no credential read (no GITHUB_TOKEN or gh auth token anywhere); the only platform path is the single execFile(\"gh\", ...) in src/client/gh.ts, fixed argv, project cwd. Runtime dependency: @opencode/plugin only.",
      "recorded_at": "2026-10-17T18:37:00.527Z"
    },
    {
      "kind": "adr",
      "id": "0002",
      "evidence": "Scanned src/: no filesystem writes (writeFile/appendFile/createWriteStream/mkdir), no localStorage/sessionStorage or host storage calls. Stack grouping is computed in memory on every refresh and discarded with it.",
      "recorded_at": "2026-10-17T18:37:00.582Z"
    },
    {
      "kind": "adr",
      "id": "0003",
      "evidence": "test/safe-text.test.ts covers ANSI escapes, C0/C1 control characters, zero-width and bidi direction controls and surrogate-safe clamping; aggregate tests assert titles and branches arrive normalised from the single toPrViews boundary. No raw platform text reaches the renderer.",
      "recorded_at": "2026-10-17T18:37:00.637Z"
    }
  ],
