  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "M2 - organización y pulido. Agrupar stacks: detectar PRs encadenados (base = head de otro PR) y agruparlos/indentarlos en la lista.",
    "kind": "feature",
    "summary": "M2 organisation and polish: group chained open pull requests (a PR base equal to another PR head) under their root in the sidebar panel, children indented base to tip, with the agreed scanning presentation; no notifications, no new actions",
    "acceptance": "Loaded in the host TUI with open PRs that form chains, the panel shows each chain under its root PR, its children indented base-to-tip, and every row keeps its state mark and CI state; with no chains the list keeps the current number order and look; panel resilience (per-kind failure copy, last good list) is unchanged."
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Se mantiene el límite de 50 PRs aunque una cadena pueda quedar cortada si su base cae fuera, o se sube?"
      },
      {
        "category": "uniqueness",
        "question": "Si dos PRs abiertos comparten la misma rama head, ¿el hijo se engancha al de número más bajo o queda sin agrupar?"
      },
      {
        "category": "persistence",
        "cite": {
          "kind": "path",
          "path": "docs/architecture/decisions/0002-no-persisted-state.md",
          "line": 1
        }
      },
      {
        "category": "copy",
        "question": "¿Los títulos se recortan a una línea para escanear mejor o se mantiene el wrap a varias líneas actual?"
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "src/plugin.ts",
          "line": 21
        }
      },
      {
        "category": "accessibility",
        "question": "¿Cómo se ve la jerarquía: sangría por nivel de profundidad o un solo nivel, y con conector (└─) o solo espacios?"
      },
      {
        "category": "errors",
        "cite": {
          "kind": "path",
          "path": "src/panel.tsx",
          "line": 24
        }
      }
    ]
