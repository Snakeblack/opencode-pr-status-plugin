  "intent": {
    "request": "M3 — paquete publicable: README, LICENSE (MIT + Commons Clause v1.0), CI de publicación con checks, política SemVer y rango de hosts soportados; revisar el advisory crítico de seroval y verificar la instalación del paquete publicado.",
    "kind": "docs",
    "summary": "M3 publishable package: README and LICENSE (MIT + Commons Clause v1.0), CI that runs the checks and publishes versioned releases, SemVer policy, declared supported host range, and a verified install of the packed artifact in the host",
    "acceptance": "The repository carries README, LICENSE (MIT + Commons Clause v1.0), the SemVer policy and the declared supported OpenCode V2 range; installing the packed artifact into a clean OpenCode V2 setup (plugins entry) loads the panel in the host TUI; test/lint/typecheck stay green locally and the CI workflow runs them on the repository remote, with the publish path to the npm artifact configured for a versioned release."
  },
  "facts": {
    "open": [
      "El repositorio no tiene remoto y el CI necesita uno: ¿creo el repositorio en GitHub como Snakeblack/opencode-pr-status-plugin y empujo main con gh, y sería público o privado?",
      "¿Publicamos de verdad en npm en este cambio (necesitarías iniciar sesión con npm login o un token) o preparo la publicación y verifico el paquete con npm pack sin subirlo todavía?",
      "¿Nombre del paquete sin scope opencode-pr-status-plugin (está libre en npm) o con scope, por ejemplo @snakeblack/opencode-pr-status-plugin?",
      "¿La publicación en CI se dispara creando un release o tag vX.Y.Z en GitHub (con NPM_TOKEN como secret) o prefieres publicar a mano con npm publish y dejar CI solo con los checks?",
      "El advisory crítico de seroval (llega vía @opencode/plugin → @opentui/solid → solid-js) sigue sin arreglo disponible: ¿lo aceptamos y lo documentamos en el README, o bloqueamos la publicación hasta que upstream lo arregle?",
      "¿Empiezo la numeración pública en 0.1.0 y declaro soporte OpenCode V2 con @opencode/plugin ^2.0.32 (probado con 2.0.32), o prefieres otro criterio de versión o de rango?",
      "¿README en inglés, como el resto de la documentación del repositorio, o en español?",
      "Antes de publicar toca revisar el supuesto de foundation «solo el autor usa el plugin» (su disparador de revisión es justo la publicación en npm): ¿confirmas que los usuarios secundarios (cualquier usuario de OpenCode que instale el plugin) entran en el alcance?"
    ]
  },
